services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: museum-image-db-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-museum_image_db}
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${POSTGRES_DB:-museum_image_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  exhibitions-postgres:
    image: pgvector/pgvector:pg16
    container_name: museum-exhibitions-postgres
    environment:
      POSTGRES_DB: ${EXHIBITION_POSTGRES_DB:-museum_exhibition_db}
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum123}
    ports:
      - "${EXHIBITION_POSTGRES_PORT:-5433}:5432"
    volumes:
      - exhibition_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${EXHIBITION_POSTGRES_DB:-museum_exhibition_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Real Google Chrome is only available in this container workflow on x86_64.
    # On Apple Silicon, force amd64 so the qwen web bridge remains usable.
    platform: ${BACKEND_PLATFORM:-linux/amd64}
    build:
      context: ./backend
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
    container_name: museum-image-db-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://museum:museum123@postgres:5432/museum_image_db}
      EXHIBITION_DATABASE_URL: ${EXHIBITION_DATABASE_URL:-postgresql+psycopg://museum:museum123@exhibitions-postgres:5432/museum_exhibition_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
      WEB_USER_DATA_DIR: /data/web_chrome_profile
      QWEN_WEB_STORAGE_STATE: /data/qwen_web_state.json
      WEB_BRIDGE_REMOTE_URL: ${WEB_BRIDGE_REMOTE_URL:-}
    # Use plain uvicorn when the browser bridge is disabled. When Chrome is installed,
    # keep Xvfb so the bridge can drive a headful browser on a headless container.
    # `xvfb-run` is unreliable here under amd64 emulation on Apple Silicon, so start
    # Xvfb explicitly and then launch uvicorn in the foreground.
    command: >
      sh -c 'if [ "$${INSTALL_BROWSER:-true}" = "true" ]; then
        cd /app &&
        Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
        export DISPLAY=:99 &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000;
      else
        cd /app && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000;
      fi'
    # Chrome needs more shared memory than the Docker default (we also pass
    # --disable-dev-shm-usage as a belt-and-braces fallback in web_bridge.py).
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./data:/data
      # Optional bind mount for a local image root. The current UI mainly uses
      # browser-side folder upload (/api/batch/scan-files), but keeping /data/import
      # mounted is still useful for manual scans or scripted imports.
      - ${IMPORT_DIR:-./import}:/data/import:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      exhibitions-postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: museum-image-db-frontend
    working_dir: /app
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    # Frontend entry points now cover:
    # 1) local folder upload -> sync to pending_artifacts
    # 2) Google Photos auth / album browse / import
    # 3) review -> identify -> submit to cloud
    command: sh -c "npm install && npm run dev:identify"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  exhibition_postgres_data:
  frontend_node_modules:
