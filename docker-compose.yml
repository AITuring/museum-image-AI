services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: museum-image-db-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-museum_image_db}
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${POSTGRES_DB:-museum_image_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: museum-image-db-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://museum:museum123@postgres:5432/museum_image_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
    # Run behind Xvfb so the 通义 web bridge can launch real Chrome headful (local role).
    # The cloud role doesn't need Chrome, but the same command is harmless there.
    command: >
      xvfb-run -a --server-args="-screen 0 1920x1080x24"
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Chrome needs more shared memory than the Docker default (we also pass
    # --disable-dev-shm-usage as a belt-and-braces fallback in web_bridge.py).
    shm_size: "1gb"
    volumes:
      - ./backend:/app
      - ./data:/data
      # Mount the directory of local images to import; scan it as /data/import in the UI.
      - ${IMPORT_DIR:-./import}:/data/import:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: museum-image-db-frontend
    working_dir: /app
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
