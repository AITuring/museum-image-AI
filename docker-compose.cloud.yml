# Cloud deployment (Alibaba Cloud server): databases, API backend, and the
# resource-isolated exhibition sync worker.
# The frontend is deployed separately to Vercel (see README "云端部署"). No Chrome /
# qwen bridge here — that runs on the local machine.
#
#   BACKEND_IMAGE=ghcr.io/<owner>/<repo>-backend:sha-<commit> docker compose -f docker-compose.cloud.yml up -d
#
# Configure .env first (APP_ROLE=cloud, INGEST_TOKEN, OSS_*, POSTGRES_*, CORS_ORIGINS).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: museum-cloud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-museum_image_db}
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${POSTGRES_DB:-museum_image_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  exhibitions-postgres:
    image: pgvector/pgvector:pg16
    container_name: museum-cloud-exhibitions-postgres
    environment:
      POSTGRES_DB: ${EXHIBITION_POSTGRES_DB:-museum_exhibition_db}
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museum123}
    volumes:
      - exhibition_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museum} -d ${EXHIBITION_POSTGRES_DB:-museum_exhibition_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: museum-cloud-backend
    env_file:
      - .env
    environment:
      APP_ROLE: cloud
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://museum:museum123@postgres:5432/museum_image_db}
      EXHIBITION_DATABASE_URL: ${EXHIBITION_DATABASE_URL:-postgresql+psycopg://museum:museum123@exhibitions-postgres:5432/museum_exhibition_db}
      APP_ENV: ${APP_ENV:-production}
      IMAGE_VARIANT_CONCURRENCY: ${IMAGE_VARIANT_CONCURRENCY:-1}
      EXHIBITION_SYNC_ENABLED: "false"
    # Cloud role does not need Chrome/Xvfb — run uvicorn directly.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - backend_data:/data
    ports:
      # Exposed for the Vercel frontend (via rewrites proxy or direct CORS). Put behind
      # an HTTPS reverse proxy in production.
      - "${BACKEND_PORT:-8000}:8000"
    # Keep a malformed or unusually large image from starving SSH, PostgreSQL,
    # and the rest of this small production host.
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1100m}
    memswap_limit: ${BACKEND_MEMORY_SWAP_LIMIT:-2500m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    depends_on:
      postgres:
        condition: service_healthy
      exhibitions-postgres:
        condition: service_healthy
    restart: unless-stopped

  exhibition-sync-worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: museum-cloud-exhibition-sync
    env_file:
      - .env
    environment:
      APP_ROLE: cloud
      EXHIBITION_DATABASE_URL: ${EXHIBITION_DATABASE_URL:-postgresql+psycopg://museum:museum123@exhibitions-postgres:5432/museum_exhibition_db}
      EXHIBITION_SYNC_ENABLED: "true"
      EXHIBITION_SYNC_CONCURRENCY: ${EXHIBITION_SYNC_CONCURRENCY:-2}
      EXHIBITION_SYNC_BACKFILL_BATCH_SIZE: ${EXHIBITION_SYNC_BACKFILL_BATCH_SIZE:-1000}
      EXHIBITION_SYNC_BACKFILL_PAUSE_SECONDS: ${EXHIBITION_SYNC_BACKFILL_PAUSE_SECONDS:-15}
      EXHIBITION_SYNC_COMMIT_BATCH_SIZE: ${EXHIBITION_SYNC_COMMIT_BATCH_SIZE:-50}
      EXHIBITION_SYNC_COMMIT_PAUSE_SECONDS: ${EXHIBITION_SYNC_COMMIT_PAUSE_SECONDS:-0.5}
    command: python scripts/sync_exhibitions.py --daemon
    mem_limit: ${EXHIBITION_SYNC_MEMORY_LIMIT:-512m}
    memswap_limit: ${EXHIBITION_SYNC_MEMORY_SWAP_LIMIT:-768m}
    cpus: ${EXHIBITION_SYNC_CPU_LIMIT:-0.35}
    depends_on:
      exhibitions-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  exhibition_postgres_data:
  backend_data:
